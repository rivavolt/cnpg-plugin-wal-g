# Builds the rivavolt fork's plugin image on every push to its branches and publishes it as ghcr.io/rivavolt/cnpg-plugin-wal-g:<branch>-<short sha>, for amd64 and arm64 since the volt cluster runs CNPG instances on both. The fork exists to carry the atomic WAL restore (internal/instance/plugin_wal.go) until upstream has it; the cluster pins the image by digest.
name: rivavolt image

on:
  push:
    branches: ['atomic-restore*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_TAG=v0.2.2-rivavolt
            GIT_COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/rivavolt/cnpg-plugin-wal-g
          tags: ghcr.io/rivavolt/cnpg-plugin-wal-g:${{ steps.tag.outputs.tag }}
